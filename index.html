<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="DTR Manager — Home" />
    <title>DTR Manager | Home</title>

    <meta name="theme-color" content="#1976d2" />
    <link rel="apple-touch-icon" href="assets/img/ico.png" sizes="180x180" />
    <link rel="icon" type="image/png" href="assets/img/ico.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="assets/img/ico.png" sizes="16x16" />
    <link rel="shortcut icon" href="assets/img/ico.png" />
    <link rel="icon" type="image/x-icon" href="assets/img/midnight.gif" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

    <link href="assets/css/bootstrap.css" rel="stylesheet" />
    <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>

    <!-- Existing reminders modal -->
    <div id="myModal" class="modal fade" tabindex="-1" aria-labelledby="remindersTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="remindersTitle"><i class="fa-solid fa-bullhorn me-2 text-primary"></i>Reminders</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">
                        Remember to select the correct <strong>clock action</strong>
                        (Clock In or Clock Out) before logging your attendance.
                        Verify that the camera preview shows your face clearly.
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">I understand</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Clock action modal
         - backdrop="static" → clicking outside does NOT dismiss
         - keyboard="false" → ESC does NOT dismiss
         - Only the X button (data-bs-dismiss) or a valid Okay+countdown can close it -->
    <div class="modal fade" id="clockActionModal" tabindex="-1"
         aria-labelledby="clockActionTitle" aria-hidden="true"
         data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="clockActionTitle">
                        <i class="fa-solid fa-clock me-2 text-primary"></i>Select Clock Action
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3 text-center">
                        Choose Clock In or Clock Out, then press <strong>Okay</strong>.
                    </p>
                    <div class="clock-action-options" role="radiogroup" aria-label="Clock action">
                        <label class="clock-action-option">
                            <input type="radio" name="clockAction" value="Clock In" />
                            <span class="clock-action-card">
                                <i class="fa-solid fa-right-to-bracket"></i>
                                <span>Clock In</span>
                            </span>
                        </label>
                        <label class="clock-action-option">
                            <input type="radio" name="clockAction" value="Clock Out" />
                            <span class="clock-action-card">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span>Clock Out</span>
                            </span>
                        </label>
                    </div>
                    <div class="clock-action-status mt-3" id="clockActionStatus"
                         role="status" aria-live="polite"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="clockActionOkay">Okay</button>
                </div>
            </div>
        </div>
    </div>

    <main class="container py-4 py-md-5" id="main">
        <div class="text-center">

            <a href="admin.html" class="action-btn" title="Admin" aria-label="Open Admin">
                <img src="assets/img/settings2.gif" alt="" />
            </a>

            <hr class="my-4" />

            <div class="clock-display" role="timer" aria-live="polite">
                <time class="clock-time" id="time" datetime=""></time>
                <time class="clock-date" id="date" datetime=""></time>
            </div>

            <video id="camera-js" class="camera-frame" autoplay muted playsinline
                   aria-label="Live camera preview for attendance capture"></video>

            <!-- Scan hint appears after a valid clock action is confirmed -->
            <div id="scanHint" class="scan-hint" role="status" aria-live="polite" hidden></div>

            <hr class="my-4" />

            <button type="button" class="btn btn-link p-0 border-0 bg-transparent"
                    title="Log attendance" aria-label="Log attendance"
                    data-bs-toggle="modal" data-bs-target="#clockActionModal">
                <span class="action-btn lg">
                    <img src="assets/img/versatile.gif" alt="" />
                </span>
            </button>

        </div>
    </main>

    <!-- Vendor (Bootstrap 5 bundle incl. Popper) + bundled app -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
